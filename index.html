<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1812" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Prosa</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/x-icon" href="./assets/favicon/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
  <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css" />
  
  <!-- Appliquer le mode clair immédiatement pour éviter le flash -->
  <script>
    (function() {
      if (localStorage.getItem('settingLightMode') === 'true') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>

</head>

<body>
  <!-- Main Menu Screen -->
  <header class="header">
    <div class="header-left" id="headerLeft">
      <!-- Back button will be placed here dynamically -->
    </div>

    <a href="/" class="logo-small logo-center" id="header-logo">
      <!-- Logo PROSA officiel -->
      <span class="logo-wrap">
        <img src="./assets/logo/prosa-logo.png" alt="PROSA" class="logo-img" />
        <span class="logo-o-lottie" data-lottie="./assets/lottie/prosa-o.json" aria-hidden="true"></span>
      </span>
    </a>

    <div class="header-right">
      <button class="settings-btn" id="settingButton" aria-label="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
        </svg>
      </button>
    </div>
  </header>

  <main class="screen" id="gameContainer">

  </main>

  <script src="./assets/libs/lottie.min.js"></script>
  <script type="module" src="./app.js"></script>

  <!-- <script type="module" src="./fronts/start_view_1/app.js"></script> -->
  <script>
    // Service Worker registration with centralized logging
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const reg = await navigator.serviceWorker.register("./service-worker.js");
          window.swLog?.log("✅ Service Worker registered!", reg);

          if (navigator.onLine) {
            window.swLog?.log("🔄 Checking for updates...");
            reg.update();
          }

          if (reg.waiting) {
            window.swLog?.log("📤 Activating waiting Service Worker...");
            reg.waiting.postMessage({ type: "SKIP_WAITING" });
          }

          reg.addEventListener("updatefound", () => {
            const newWorker = reg.installing;
            if (!newWorker) return;

            window.swLog?.log("🔨 New Service Worker installing...");

            newWorker.addEventListener("statechange", () => {
              if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                window.swLog?.log("📤 New Service Worker ready, activating...");
                newWorker.postMessage({ type: "SKIP_WAITING" });
              }
            });
          });

          let refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (refreshing) return;
            refreshing = true;
            window.swLog?.log("🔄 Controller changed, reloading...");
            window.location.reload();
          });

          // Log online/offline events
          window.addEventListener("online", () => {
            window.swLog?.log("📡 Back online!");
          });

          window.addEventListener("offline", () => {
            window.swLog?.log("📴 Went offline - using cached content");
          });

        } catch (err) {
          window.swLog?.error("❌ Service Worker registration error:", err);
        }
      });
    }
  </script>
</body>

</html>
