<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F1D482" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PROSA</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/img/icon1.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <!-- Main Menu Screen -->
  <header class="header">
    <a href="/" class="logo-small" id="header-logo">
      <!-- Logo PROSA officiel -->
      <span class="logo-wrap">
        <img src="./assets/logo/prosa-logo.png" alt="PROSA" class="logo-img" />
        <span class="logo-o-lottie" data-lottie="./assets/lottie/prosa-o.json" aria-hidden="true"></span>
      </span>
    </a>
    <button class="settings-btn" id="settingButton" aria-label="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path
          d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </svg>
    </button>
  </header>

  <main class="screen" id="gameContainer">

  </main>

  <script src="./assets/libs/lottie.min.js"></script>
  <script type="module" src="./app.js"></script>

  <!-- <script type="module" src="./fronts/start_view_1/app.js"></script> -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js")
          .then((reg) => console.log("Service Worker enregistré !", reg))
          .catch((err) => console.error("Erreur SW :", err));
      });
    }
  </script>
</body>

</html>
