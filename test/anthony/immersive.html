<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Immersive AR World</title>

  <!-- Local Three.js files for WebXR Viewer compatibility -->
  <script src="./js/three.min.js"></script>
  <script src="./js/GLTFLoader.js"></script>
  
  <!-- Fallback to CDN if local fails -->
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"><\/script>');
    }
  </script>

  <link rel="stylesheet" href="./css/immersive.css">
  
  <!-- Inline loading styles so they show immediately -->
  <style>
    #loading-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #loading-screen .spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-screen p { margin-top: 20px; font-size: 16px; }
    #loading-screen #debug-info { font-size: 12px; color: #aaa; margin-top: 10px; max-width: 80%; text-align: center; }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>Loading AR Experience...</p>
    <div id="debug-info">Initializing...</div>
  </div>

  <div id="container">
    <!-- AR Scene Container -->
  </div>

  <!-- Asset Selection Menu -->
  <div id="asset-menu" class="menu" style="pointer-events: auto;">
    <h3>Select Asset to Place</h3>
    <div class="asset-grid">
      <button class="asset-btn" data-model="character.glb">
        <span class="asset-icon">👤</span>
        <span>Character</span>
      </button>
      <button class="asset-btn" data-model="conifer_tree.glb">
        <span class="asset-icon">🌲</span>
        <span>Tree</span>
      </button>
      <button class="asset-btn" data-model="stone.glb">
        <span class="asset-icon">🪨</span>
        <span>Stone</span>
      </button>
    </div>
    <div style="margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 8px;">
      <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
        <input type="checkbox" id="placement-mode" style="width: 20px; height: 20px; cursor: pointer;">
        <span style="font-size: 14px;">🎯 Enable Placement Mode</span>
      </label>
    </div>
    <button id="clear-all-btn" class="clear-btn">🗑️ Clear All</button>
    <button id="toggle-menu" class="toggle-btn">▼</button>
  </div>

  <!-- Instructions Overlay -->
  <div id="instructions" class="overlay">
    <div class="overlay-content">
      <h2>🌍 Immersive AR World</h2>
      <p>Configure your settings for the best experience</p>
      
      <div id="ios-warning" style="display: none; background: rgba(255, 100, 100, 0.3); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ff6b6b;">
        <p style="margin: 0; font-weight: 600; color: #ff6b6b;">⚠️ iOS Detected</p>
        <p style="margin: 5px 0 0 0; font-size: 14px;">WebXR AR is not supported on iOS Safari. Use the <a href="./index.html" style="color: #667eea;">marker-based AR</a> instead, or use an Android device.</p>
      </div>
      
      <div style="margin: 20px 0; text-align: left;">
        <label style="display: block; margin-bottom: 15px;">
          <span style="display: block; margin-bottom: 5px; font-weight: 600;">Your Height (cm):</span>
          <input type="number" id="user-height" value="170" min="120" max="220" style="width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 2px solid #667eea;">
        </label>
        
        <label style="display: block; margin-bottom: 15px;">
          <span style="display: block; margin-bottom: 5px; font-weight: 600;">Playstyle:</span>
          <select id="playstyle" style="width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 2px solid #667eea;">
            <option value="standing">Standing</option>
            <option value="sitting">Sitting</option>
          </select>
        </label>
      </div>
      
      <button id="start-ar-btn" class="primary-btn">Start AR Experience</button>
    </div>
  </div>

  <!-- Status Bar -->
  <div id="status-bar" class="status-bar" style="pointer-events: none;">
    <span id="status-text">Initializing...</span>
  </div>

  <!-- Exit AR Button -->
  <button id="exit-ar-btn" class="exit-btn hidden" style="pointer-events: auto;">❌ Exit AR</button>
  
  <!-- Subtitle Test Button -->
  <button id="subtitleTestBtn" class="subtitle-test-btn">💬 Test Subtitles</button>
  
  <!-- Subtitle Display -->
  <div id="subtitles" class="subtitles" style="display: none;">
    <span id="subtitleText"></span>
  </div>
  
  <!-- iOS Detection Script -->
  <script>
    (function() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      
      // Only show warning if iOS AND WebXR is not available
      // WebXR Viewer provides WebXR on iOS, so don't block it
      if (isIOS && !navigator.xr) {
        document.addEventListener('DOMContentLoaded', function() {
          const warning = document.getElementById('ios-warning');
          if (warning) warning.style.display = 'block';
        });
      }
    })();
  </script>

  <script src="./js/immersive.js"></script>
</body>
</html>
