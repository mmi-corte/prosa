<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Character Card Scanner</title>
  
  <!-- Import Map for ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
  
  <link rel="stylesheet" href="cards/css/cards.css">
  
  <!-- Character Configuration (non-module, loads first) -->
  <script src="cards/js/characters-config.js"></script>
  
  <!-- Main App (ES Module) -->
  <script type="module" src="cards/js/card-scanner.js"></script>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loader"></div>
    <p id="loading-text">Loading Card Scanner...</p>
  </div>

  <!-- AR Container -->
  <div id="ar-container"></div>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <!-- Control Buttons (top right) -->
    <div id="control-buttons">
      <button id="mute-btn" class="control-btn" title="Mute/Unmute">
        🔊
      </button>
      <button id="zoom-btn" class="control-btn" title="Expand Info">
        🔍
      </button>
    </div>
    
    <!-- Scan Prompt -->
    <div id="scan-prompt">
      <div class="scan-icon">📷</div>
      <p>Point camera at a character card</p>
    </div>
    
    <!-- Expanded Info Modal (fullscreen description) -->
    <div id="info-modal" class="hidden">
      <div class="modal-content">
        <div class="modal-header">
          <div id="modal-portrait"></div>
          <h2 id="modal-character-name"></h2>
          <button id="close-modal-btn">✕</button>
        </div>
        <div class="modal-body">
          <p id="modal-description"></p>
          <div id="modal-stats"></div>
        </div>
      </div>
    </div>
    
    <!-- Status Bar -->
    <div id="status-bar">
      <span id="status-text">Initializing...</span>
    </div>
    
    <!-- Debug Panel (toggle with 'd' key) -->
    <div id="debug-panel" class="hidden">
      <h4>Detected Characters:</h4>
      <ul id="detected-list"></ul>
    </div>
  </div>

  <!-- Audio Elements (for non-spatial sounds) -->
  <div id="audio-container"></div>
</body>
</html>
