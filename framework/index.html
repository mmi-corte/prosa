<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <button class="startButton" value="1" type="button">Départ Corte</button>
      <button class="startButton" value="2" type="button">Départ Toulon</button>
      <button class="startButton" value="3" type="button">Départ Prosa</button>
    </div>

    <input
      id="startStepButton"
      type="button"
      value="Lancer l'étape 1.1 - Corse"
    />
  </body>
  <script type="module" src="main.js"></script>

  <script>
    const startButtonsList = document.querySelectorAll(".startButton");
    const startButtons = [...startButtonsList];

    startButtons.forEach((element) =>
      element.addEventListener("click", () => {
        const selectedArea = element.value;
        localStorage.setItem("playerLocalisation", selectedArea);
        console.log(localStorage.getItem("playerLocalisation"));
      })
    );
  </script>
</html>
