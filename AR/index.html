<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner de Cartes - PROSA</title>
  
  <!-- Base path detection for GitHub Pages / local compatibility -->
  <script>
    window.BASE_PATH = (function() {
      var path = window.location.pathname;
      if (path.startsWith('/prosa/')) {
        return '/prosa';
      }
      return '';
    })();
    window.resolvePath = function(path) {
      if (path.startsWith('/')) {
        return window.BASE_PATH + path;
      }
      return path;
    };
  </script>

  <!-- PROSA Font -->
  <style>
    @font-face {
      font-family: 'Futura';
      src: url('../assets/fonts/FuturaCondMedium.woff2') format('woff2'),
           url('../assets/fonts/FuturaCondMedium.woff') format('woff');
      font-weight: 100;
      font-style: normal;
      font-display: swap;
    }
  </style>
  
  <!-- Import Map for ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
  
  <link rel="stylesheet" href="css/cards.css">
  
  <!-- Main App (ES Module) - loads JSON config internally -->
  <script type="module" src="js/card-scanner.js"></script>
</head>
<body>
  <!-- AR Container -->
  <div id="ar-container"></div>
  
  <!-- Scanning Animation -->
  <div id="scan-animation">
    <div class="scan-line"></div>
  </div>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <!-- Control Buttons (top right) -->
    <div id="control-buttons">
      <button id="back-btn" class="control-btn" title="Back to Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <button id="mute-btn" class="control-btn" title="Mute/Unmute">
        <svg id="sound-on-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg id="sound-off-icon" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
      <!-- More Info Button with hint -->
      <div id="zoom-hint-container" class="zoom-hint-container hidden">
        <button id="zoom-btn" class="control-btn zoom-bounce" title="Plus d'infos">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 16v-4"></path>
            <path d="M12 8h.01"></path>
          </svg>
        </button>
        <div class="zoom-arrow">
          <span>Plus d'infos</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 19V5"></path>
            <path d="M5 12l7-7 7 7"></path>
          </svg>
        </div>
      </div>
    </div>
    
    <!-- Expanded Info Modal (fullscreen description) -->
    <div id="info-modal" class="hidden">
      <div class="modal-content">
        <div class="modal-header">
          <img id="modal-portrait" src="" alt="Portrait du personnage">
          <h2 id="modal-character-name"></h2>
          <button id="lang-toggle-btn" class="lang-toggle-btn" title="Passer en Corse">
            <img src="assets/img/corsu.png" alt="CO" class="lang-icon" id="corsican-flag">
            <span class="lang-icon hidden" id="french-flag">🇫🇷</span>
          </button>
          <button id="close-modal-btn">✕</button>
        </div>
        <div class="modal-body">
          <p id="modal-description"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Audio Elements (for non-spatial sounds) -->
  <div id="audio-container"></div>
</body>
</html>
