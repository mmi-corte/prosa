<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Étape 14 : La Traversée (Final)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'Futura';
            src: local('Arial Narrow'), local('sans-serif');
            font-weight: 700;
        }

        :root {
            --background: #1a1812;
            --foreground: #ece4cb;
            --primary: #626247;
            --accent-red: #c63032;
            --accent-blue: #81cbd6;
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            font-family: 'Futura', sans-serif;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #0a0a08;
        }

        .ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        .hud-panel {
            background: rgba(10, 10, 8, 0.85);
            border-left: 2px solid var(--primary);
            padding: 10px 20px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-action {
            background: var(--primary);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(98, 98, 71, 0.3);
        }

        .btn-action:hover {
            background: #7a7a5a;
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(98, 98, 71, 0.6);
        }

        .btn-action:active {
            transform: translateY(1px);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(98, 98, 71, 0.1);
            color: #ece4cb;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bar-container {
            width: 150px;
            height: 6px;
            background: #222;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-red);
            transition: width 0.1s linear;
            box-shadow: 0 0 10px var(--accent-red);
        }

        .damage-flash {
            position: absolute;
            inset: 0;
            background: var(--accent-red);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
            z-index: 20;
        }

        #tutorial-hint {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            animation: pulse 2s infinite;
            text-align: center;
            font-size: 1rem;
            color: var(--accent-blue);
            text-shadow: 0 0 10px rgba(129, 203, 214, 0.5);
            pointer-events: none;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); } 50% { opacity: 1; transform: translateX(-50%) scale(1.05); } }
    </style>
</head>
<body>

<div class="canvas-container">
    <canvas id="gameCanvas"></canvas>
    <div id="damage-overlay" class="damage-flash"></div>

    <!-- UI -->
    <div class="ui-layer">
        <div class="flex justify-between w-full">
            <div class="hud-panel">
                <div class="text-[10px] text-[#9a9680] tracking-widest">CAP VERS PROSA</div>
                <div class="text-3xl text-white font-bold" id="score-display">0m</div>
            </div>
            <div class="hud-panel text-right">
                <div class="text-[10px] text-[#9a9680] tracking-widest">DÉTECTION</div>
                <div class="bar-container ml-auto">
                    <div id="alert-bar" class="bar-fill"></div>
                </div>
            </div>
        </div>
        
        <div id="tutorial-hint" class="hidden">
            <p>◄ GLISSEZ POUR ESQUIVER ►</p>
            <p class="text-xs mt-2 text-white">Évitez les projecteurs et les mines</p>
        </div>
    </div>
</div>

<!-- START SCREEN -->
<div id="screen-start" class="modal active">
    <div class="text-center max-w-lg p-10 border border-[#3a3830] bg-[#1a1812] shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#626247] to-transparent"></div>
        
        <h1 class="text-6xl mb-2 text-[#ece4cb] tracking-tighter">LA TRAVERSÉE</h1>
        <div class="w-16 h-1 bg-[#c63032] mx-auto mb-6"></div>
        
        <p class="text-[#9a9680] mb-8 normal-case text-lg leading-relaxed">
            La mer est truffée de mines et de patrouilles.<br>
            L'Orcu compte sur votre agilité.<br>
            <strong class="text-[#ece4cb]">Ne vous faites pas repérer.</strong>
        </p>
        
        <div class="flex flex-col gap-4 items-center">
            <button class="btn-action w-full" onclick="startGame()">LANCER L'EMBARCATION</button>
            <button class="btn-secondary text-xs opacity-50 hover:opacity-100" onclick="autoWin()">[DEV] Passer (Carte des Vents)</button>
        </div>
    </div>
</div>

<!-- GAME OVER SCREEN -->
<div id="screen-end" class="modal">
    <div class="text-center max-w-lg p-10 border border-[#3a3830] bg-[#1a1812] shadow-2xl relative">
        <h1 id="end-title" class="text-5xl mb-4 font-bold"></h1>
        <p id="end-msg" class="text-[#9a9680] mb-8 normal-case text-xl"></p>
        
        <div class="bg-[#0a0a08] p-6 mb-8 border-l-4 border-[#626247] text-left">
            <p class="text-xs text-[#626247] mb-2">CHRONIQUE DE L'ORCU</p>
            <p id="end-poem" class="text-sm italic text-[#ece4cb] leading-relaxed">Génération du récit...</p>
        </div>
        
        <button class="btn-action" onclick="location.reload()">REJOUER</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const apiKey = ""; // La clé est injectée par l'environnement

    // CONFIGURATION
    const CONF = {
        speed: 6,
        maxDistance: 1500,
        spawnRate: 40,
        lightSpeed: 0.025
    };

    // ETAT DU JEU
    let state = {
        running: false,
        finished: false,
        distance: 0,
        alert: 0,
        boat: { x: 0, y: 0, w: 30, h: 60, targetX: 0 },
        obstacles: [], 
        lights: [], 
        particles: [],
        sonarPing: 0,
        frameCount: 0,
        shake: 0
    };

    // INITIALISATION
    function init() {
        resize();
        window.addEventListener('resize', resize);
        
        // Input Souris & Touch
        canvas.addEventListener('mousemove', e => handleInput(e.clientX));
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            handleInput(e.touches[0].clientX);
        }, { passive: false });
        
        // Démarrage de la boucle de rendu
        requestAnimationFrame(loop);
    }

    function resize() {
        // Fallback si dimensions invalides
        canvas.width = window.innerWidth || document.documentElement.clientWidth || 800;
        canvas.height = window.innerHeight || document.documentElement.clientHeight || 600;
        
        // On recentre le bateau si le jeu n'a pas commencé
        if (!state.running) {
            state.boat.x = canvas.width / 2;
            state.boat.targetX = canvas.width / 2;
            state.boat.y = canvas.height - 180;
        }
    }

    function handleInput(x) {
        if (!state.running || state.finished) return;
        state.boat.targetX = x;
    }

    function startGame() {
        console.log("Jeu démarré");
        
        // 1. Force Resize pour garantir les dimensions
        resize();
        
        // 2. Initialisation explicite de TOUT l'état
        state.finished = false;
        state.distance = 0;
        state.alert = 0;
        state.obstacles = [];
        state.particles = [];
        state.frameCount = 0;
        
        // Reset Bateau
        state.boat.x = canvas.width / 2;
        state.boat.targetX = canvas.width / 2;
        state.boat.y = canvas.height - 180;

        // Reset Lumières (Avec valeurs par défaut sûres)
        const w = canvas.width > 0 ? canvas.width : 800; 
        state.lights = [
            { x: w * 0.2, currentX: w * 0.2, angle: 0, speed: 0.015, phase: 0 },
            { x: w * 0.8, currentX: w * 0.8, angle: 0, speed: 0.02, phase: Math.PI }
        ];

        // 3. UI Updates
        document.getElementById('screen-start').classList.remove('active');
        document.getElementById('tutorial-hint').classList.remove('hidden');
        
        // 4. Activation
        state.running = true;
    }

    function autoWin() {
        endGame(true, "Carte des Vents utilisée");
    }

    // LOGIQUE
    function update() {
        if (!state.running || state.finished) return;

        try {
            state.frameCount++;
            state.distance += 0.8;
            state.sonarPing += 0.02;
            if (state.sonarPing > 1) state.sonarPing = 0;

            // Mouvement fluide du bateau
            state.boat.x += (state.boat.targetX - state.boat.x) * 0.15;
            state.boat.x = Math.max(30, Math.min(canvas.width - 30, state.boat.x));

            // Génération d'obstacles
            if (state.frameCount % CONF.spawnRate === 0) {
                const rand = Math.random();
                let type = 'rock';
                if (rand > 0.7) type = 'mine';
                else if (rand > 0.9) type = 'driftwood';

                state.obstacles.push({
                    x: Math.random() * (canvas.width - 60) + 30,
                    y: -100,
                    w: type === 'rock' ? 50 : (type === 'mine' ? 30 : 40),
                    h: type === 'driftwood' ? 60 : 30,
                    type: type,
                    rotation: Math.random() * Math.PI
                });
            }

            // Mise à jour Obstacles
            for (let i = state.obstacles.length - 1; i >= 0; i--) {
                let o = state.obstacles[i];
                o.y += CONF.speed;
                o.rotation += 0.02;

                if (checkCollision(state.boat, o)) {
                    let dmg = 15;
                    if (o.type === 'mine') dmg = 35; 
                    triggerDamage(dmg);
                    state.obstacles.splice(i, 1);
                    continue;
                }
                if (o.y > canvas.height + 50) state.obstacles.splice(i, 1);
            }

            // Mise à jour Lumières
            state.lights.forEach(l => {
                l.phase += l.speed;
                l.currentX = l.x + Math.sin(l.phase) * (canvas.width * 0.35);
                
                const distX = Math.abs(l.currentX - state.boat.x);
                if (distX < 70) {
                    state.alert += 0.8;
                    state.boat.detected = true;
                } else {
                    state.boat.detected = false;
                }
            });

            // Particules
            if (state.frameCount % 3 === 0) {
                state.particles.push({
                    x: state.boat.x + (Math.random() - 0.5) * 20,
                    y: state.boat.y + 30,
                    life: 1,
                    vx: (Math.random() - 0.5) * 2,
                    vy: 4 + Math.random() * 2
                });
            }
            for (let i = state.particles.length - 1; i >= 0; i--) {
                let p = state.particles[i];
                p.y += p.vy;
                p.x += p.vx;
                p.life -= 0.03;
                if(p.life <= 0) state.particles.splice(i, 1);
            }

            // Gestion de l'alerte
            if (!state.boat.detected && state.alert > 0) state.alert -= 0.15;
            state.alert = Math.max(0, Math.min(100, state.alert));

            // Fin de jeu
            if (state.alert >= 100) endGame(false, "REPÉRÉ PAR LES PHARES !");
            else if (state.distance >= CONF.maxDistance) endGame(true, "TERRE EN VUE");

            // Shake screen decay
            if (state.shake > 0) state.shake *= 0.9;
            if (state.shake < 0.5) state.shake = 0;

            updateUI();

        } catch (error) {
            console.error("Erreur Update Loop:", error);
            // On ne crash pas, on continue
        }
    }

    // RENDU
    function draw() {
        // Toujours effacer pour éviter les traces si ça bug
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        try {
            ctx.save();
            
            if (state.shake > 0) {
                const dx = (Math.random() - 0.5) * state.shake;
                const dy = (Math.random() - 0.5) * state.shake;
                ctx.translate(dx, dy);
            }

            // 1. Océan
            const grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grd.addColorStop(0, '#050505');
            grd.addColorStop(1, '#1a1d21');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grille de vagues
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 2;
            const offset = (state.frameCount * CONF.speed) % 80;
            for(let i = 0; i < canvas.height + 80; i+= 80) {
                let y = i + offset - 80;
                if (y > canvas.height) continue;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // 2. Obstacles
            state.obstacles.forEach(o => {
                ctx.save();
                ctx.translate(o.x, o.y);
                ctx.rotate(o.rotation);

                if (o.type === 'mine') {
                    ctx.fillStyle = '#333';
                    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#222';
                    ctx.lineWidth = 3;
                    for(let k=0; k<4; k++) {
                        ctx.rotate(Math.PI/2);
                        ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, 20); ctx.stroke();
                    }
                    const pulse = Math.sin(state.frameCount * 0.2) * 0.5 + 0.5;
                    ctx.fillStyle = `rgba(255, 50, 50, ${pulse})`;
                    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
                } else if (o.type === 'rock') {
                    ctx.fillStyle = '#2a2824';
                    ctx.beginPath();
                    ctx.moveTo(-20, -10); ctx.lineTo(20, -15); ctx.lineTo(10, 20); ctx.lineTo(-15, 15);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath(); ctx.arc(-5, 5, 10, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            });

            // 3. Particules
            state.particles.forEach(p => {
                ctx.fillStyle = `rgba(129, 203, 214, ${p.life * 0.4})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.life * 6, 0, Math.PI*2);
                ctx.fill();
            });

            // 4. Bateau
            const boatX = state.boat.x;
            const boatY = state.boat.y;
            
            ctx.save();
            ctx.translate(boatX, boatY);
            const tilt = (state.boat.targetX - boatX) * 0.08;
            ctx.rotate(tilt * Math.PI / 180);

            if (state.running) {
                ctx.strokeStyle = `rgba(129, 203, 214, ${1 - state.sonarPing})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(0, 0, state.sonarPing * 150 + 20, 0, Math.PI*2);
                ctx.stroke();
            }

            ctx.fillStyle = '#111';
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 18, 45, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ece4cb'; 
            ctx.beginPath(); ctx.arc(0, 10, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#626247'; 
            ctx.beginPath(); ctx.arc(0, -15, 10, 0, Math.PI*2); ctx.fill();

            ctx.restore();

            // 5. Projecteurs
            ctx.globalCompositeOperation = 'screen';
            state.lights.forEach(l => {
                const lx = l.currentX || l.x || 0; // Fallback absolu
                
                const isAlert = Math.abs(lx - boatX) < 70;
                const colorStart = isAlert ? 'rgba(255, 50, 50, 0.6)' : 'rgba(255, 230, 180, 0.3)';

                const lightGrd = ctx.createRadialGradient(lx, -100, 20, lx, boatY, 600);
                lightGrd.addColorStop(0, '#fff');
                lightGrd.addColorStop(0.1, colorStart);
                lightGrd.addColorStop(1, 'rgba(0,0,0,0)');

                ctx.fillStyle = lightGrd;
                ctx.beginPath();
                ctx.moveTo(lx, -100);
                ctx.lineTo(lx + 150, canvas.height);
                ctx.lineTo(lx - 150, canvas.height);
                ctx.fill();
            });
            ctx.globalCompositeOperation = 'source-over';

            ctx.restore();
        } catch (e) {
            console.error("Erreur Draw:", e);
        }
    }

    function loop() {
        requestAnimationFrame(loop);
        update();
        draw();
    }

    // UTILITAIRES
    function checkCollision(boat, obj) {
        const dx = boat.x - obj.x;
        const dy = boat.y - obj.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        return dist < (20 + obj.w/2);
    }

    function triggerDamage(amount) {
        state.alert += amount;
        state.shake = 10;
        const flash = document.getElementById('damage-overlay');
        flash.style.opacity = 0.6;
        setTimeout(() => flash.style.opacity = 0, 150);
        navigator.vibrate?.(200);
    }

    function updateUI() {
        document.getElementById('score-display').innerText = Math.floor(state.distance) + "m";
        document.getElementById('alert-bar').style.width = state.alert + "%";
        if(state.distance > 100) document.getElementById('tutorial-hint').classList.add('hidden');
    }

    async function endGame(win, reason) {
        state.finished = true;
        const screen = document.getElementById('screen-end');
        screen.classList.add('active');
        
        const titleEl = document.getElementById('end-title');
        const msgEl = document.getElementById('end-msg');
        
        if (win) {
            titleEl.innerText = "TRIOMPHE";
            titleEl.className = "text-5xl mb-4 font-bold text-[#81cbd6]";
            msgEl.innerText = "Prosa est atteinte. L'ombre de l'Orcu vous a protégé.";
        } else {
            titleEl.innerText = "CAPTIVITÉ";
            titleEl.className = "text-5xl mb-4 font-bold text-[#c63032]";
            msgEl.innerText = reason;
        }

        const poemEl = document.getElementById('end-poem');
        poemEl.innerText = "L'écume murmure une prophétie...";
        
        if (!apiKey) {
            poemEl.innerText = "Le vent emporte les mots...";
            return;
        }

        try {
            const prompt = `Contexte: Jeu vidéo Corse mystique. Issue: ${win ? 'Victoire furtive' : 'Échec et capture'}. 
            Génère un quatrain en français, style ancien et sombre. Pas de rimes faciles.`;
            
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) poemEl.innerText = text;
        } catch (e) {
            poemEl.innerText = "Le silence est la seule réponse.";
        }
    }

    // Lancement au chargement
    window.onload = init;

</script>
</body>
</html>
