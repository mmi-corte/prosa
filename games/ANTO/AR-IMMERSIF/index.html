<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR Immersif - PROSA</title>
  
  <!-- Three.js - Load in HEAD for reliability -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Start Screen -->
  <div id="loading-screen" class="start-screen">
    <div class="start-content">
      <div class="logo-container">
        <img src="../../../fronts/start_view_1/public/images/prosa-logo.png" alt="PROSA" class="logo-main">
      </div>
      <div class="spinner-container">
        <img src="../../../fronts/start_view_1/public/images/chargement.png" alt="" class="spinner-spiral">
      </div>
      <p class="start-text">Appuyez pour commencer</p>
    </div>
  </div>

  <!-- Main Container -->
  <div id="container"></div>

  <!-- Status Bar -->
  <div id="status-bar" class="status-bar">
    <span id="status-text">Initialisation...</span>
  </div>

  <!-- Subtitles -->
  <div id="subtitles" class="subtitles hidden"></div>

  <!-- Debug Info -->
  <div id="debug-info" style="position:fixed;bottom:60px;left:10px;color:yellow;font-size:12px;z-index:1000;background:rgba(0,0,0,0.5);padding:4px;"></div>

  <!-- Main Script -->
  <script src="script.js"></script>
</body>
</html>
