<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Immersif - PROSA</title>

  <!-- Local Three.js files for WebXR Viewer compatibility -->
  <script src="./js/three.min.js"></script>
  <script src="./js/GLTFLoader.js"></script>
  
  <!-- Fallback to CDN if local fails -->
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"><\/script>');
    }
  </script>

  <link rel="stylesheet" href="./css/immersive.css">
  
  <!-- Inline loading styles so they show immediately -->
  <style>
    #loading-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #loading-screen .spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-screen p { margin-top: 20px; font-size: 16px; }
    #loading-screen #debug-info { font-size: 12px; color: #aaa; margin-top: 10px; max-width: 80%; text-align: center; }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>Loading AR Experience...</p>
    <div id="debug-info">Initializing...</div>
  </div>

  <div id="container">
    <!-- AR Scene Container -->
  </div>

  <!-- Status Bar -->
  <div id="status-bar" class="status-bar" style="pointer-events: none;">
    <span id="status-text">Initializing...</span>
  </div>

  <!-- Exit AR Button -->
  <button id="exit-ar-btn" class="exit-btn hidden" style="pointer-events: auto;">❌ Exit AR</button>
  
  <!-- Subtitle Display -->
  <div id="subtitles" class="subtitles" style="display: none;">
    <span id="subtitleText"></span>
  </div>
  
  <script src="./js/immersive.js"></script>
</body>
</html>
