<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1812">
    <title>Étape 14 : La Traversée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>
</div>
<div id="damage-overlay" class="damage-flash"></div>

<!-- UI LAYER -->
<div class="ui-layer">
    <div class="hud-top">
        <div class="hud-panel">
            <div class="text-[10px] text-[#9a9680] tracking-widest uppercase mb-1">Objectif</div>
            <div class="text-3xl text-white font-bold tracking-tight" id="dist-txt">1200m</div>
        </div>
        <div class="hud-panel text-right">
            <div class="text-[10px] text-[#9a9680] tracking-widest uppercase mb-1">Alerte</div>
            <div class="bar-container w-32 ml-auto">
                <div id="alert-bar" class="bar-fill"></div>
            </div>
        </div>
    </div>
    
    <div id="tutorial-ui" class="absolute inset-x-0 bottom-32 text-center pointer-events-none transition-opacity duration-500">
        <div id="tuto-hand" class="text-4xl text-[#81cbd6]">👆</div>
        <p class="text-lg text-white font-bold drop-shadow-md mt-16">GLISSEZ POUR ESQUIVER</p>
    </div>
</div>

<!-- START MODAL -->
<div id="modal-start" class="modal active">
    <div class="w-full max-w-md bg-[#1a1812] border border-[#3a3830] p-8 shadow-2xl rounded-lg relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#626247] to-transparent"></div>
        
        <h1 class="text-4xl text-center text-[#ece4cb] mb-2 tracking-tighter">LA TRAVERSÉE</h1>
        <div class="w-12 h-1 bg-[#c63032] mx-auto mb-6 rounded"></div>
        
        <div class="text-[#9a9680] mb-8 text-base leading-relaxed normal-case">
            <p class="mb-4 text-center">L'Orcu doit atteindre Prosa incognito.</p>
            <ul class="list-disc pl-6 space-y-2 border-l-2 border-[#626247] ml-2 bg-[#0f0d0a] p-3 rounded-r">
                <li><strong>Glissez</strong> pour diriger le bateau.</li>
                <li><strong>Évitez</strong> les rochers et les mines.</li>
                <li><strong class="text-[#c63032]">ATTENTION :</strong> Un immense projecteur balaye la mer. Restez hors du faisceau !</li>
            </ul>
        </div>
        
        <button class="btn-action" onclick="game.start()">COMMENCER</button>
        <button class="text-xs text-[#626247] text-center w-full mt-4 p-2" onclick="game.end(true, 'Carte des Vents')">[DEV] Passer</button>
    </div>
</div>

<!-- END MODAL -->
<div id="modal-end" class="modal">
    <div class="w-full max-w-md bg-[#1a1812] border border-[#3a3830] p-8 shadow-2xl rounded-lg">
        <h1 id="end-title" class="text-4xl text-center font-bold mb-2"></h1>
        <p id="end-msg" class="text-[#9a9680] text-center mb-8 text-lg normal-case"></p>
        
        <div class="bg-[#0f0d0a] border-l-2 border-[#626247] p-4 mb-6 rounded-r">
            <p class="text-[10px] text-[#626247] uppercase mb-1">La voix de l'Orcu</p>
            <p id="end-poem" class="text-sm italic text-[#ece4cb] leading-relaxed">...</p>
        </div>
        
        <button id="btn-continue" class="btn-action hidden" onclick="if(window.finishGame) window.finishGame(true); else ((new URLSearchParams(window.location.search)).get('from')==='minigames' ? window.location.href='../../../index.html#univers-prosa/mini-jeux' : history.back())">CONTINUER</button>
        <button class="btn-action" onclick="location.reload()">REJOUER</button>
        <button id="btn-abandon" class="btn-action hidden" style="background:transparent;color:#888;border-color:#555;margin-top:8px;" onclick="if(window.finishGame) window.finishGame(false); else ((new URLSearchParams(window.location.search)).get('from')==='minigames' ? window.location.href='../../../index.html#univers-prosa/mini-jeux' : history.back())">ABANDONNER</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
