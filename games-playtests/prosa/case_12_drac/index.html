<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Confrontation : Le Drac</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="game-container">
        <!-- Background Canvas -->
        <canvas id="particle-canvas" class="layer"></canvas>
        <div class="layer scanlines"></div>
        <div class="layer vignette"></div>
        <div class="layer noise"></div>
        <div id="flash-overlay" class="layer flash"></div>

        <!-- 1. INTRO SCREEN -->
        <div id="intro-screen" class="screen active">
            <div id="intro-content" class="animate-fadeIn">
                <div class="title-box">
                    <p style="color:#9a9680; font-size:0.8rem; letter-spacing:0.3em; margin-bottom:1rem;">PROSA - CASE 12</p>
                    <h1 style="font-size:3.5rem; margin:0; line-height:0.9;">LE DRAC</h1>
                    <h2 style="font-size:2rem; margin:0; color:var(--accent); font-weight:300; letter-spacing:0.2em;">CONFRONTATION</h2>
                </div>
                <button class="btn-action animate-pulse" onclick="game.goToStory()">
                    <svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    COMMENCER
                </button>
            </div>
        </div>

        <!-- 2. STORY SCREEN -->
        <div id="story-screen" class="screen" onclick="game.advanceStory()">
            <div class="layer" style="display:flex; justify-content:flex-end; padding:2rem; font-size:0.8rem; color:#555;">
                APPUYER POUR CONTINUER >>
            </div>
            <div id="story-text-container"></div>
            <div class="story-dots" id="story-dots"></div>
        </div>

        <!-- 3. CHOICE SCREEN -->
        <div id="choice-screen" class="screen">
            <div style="flex:0.3; display:flex; align-items:center; justify-content:center;">
                <h2 style="border-bottom:1px solid #333; padding-bottom:10px; letter-spacing:0.2em;">QUELLE STRATEGIE ?</h2>
            </div>
            <div id="choice-container">
                <button class="btn-action choice-card" onclick="game.initCombat('HARD')">
                    <div class="icon-circle" style="border-color:var(--accent);">
                        <svg class="icon" style="color:var(--accent);" viewBox="0 0 24 24"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/></svg>
                    </div>
                    <div>
                        <div style="color:var(--accent); font-size:1.2rem; font-weight:bold;">COMBAT DIRECT</div>
                        <div style="font-size:0.8rem; opacity:0.7; margin-top:4px;">Difficile - Le Drac est puissant</div>
                    </div>
                </button>
                <button class="btn-action choice-card" onclick="game.initCombat('NORMAL')">
                    <div class="icon-circle" style="border-color:var(--ally);">
                        <svg class="icon" style="color:var(--ally);" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                    <div>
                        <div style="color:var(--ally); font-size:1.2rem; font-weight:bold;">EXPLOITER SES FAIBLESSES</div>
                        <div style="font-size:0.8rem; opacity:0.7; margin-top:4px;">Normal - Utilisez l'environnement</div>
                    </div>
                </button>
            </div>
        </div>

        <!-- TUTORIAL OVERLAY -->
        <div id="tutorial-overlay">
            <h3 style="font-size:2rem; margin-bottom:2rem; border-bottom:2px solid #fff;">TUTORIEL</h3>
            <div class="tuto-row">
                <svg class="icon-lg" style="color:var(--accent);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                <div>
                    <div style="color:var(--accent); font-weight:bold;">DEFENSE (QTE)</div>
                    <div style="font-size:0.9rem; opacity:0.8;">Tapez sur les cibles 1, 2, 3 qui apparaissent.</div>
                </div>
            </div>
            <div class="tuto-row">
                <svg class="icon-lg" style="color:var(--text-color);" viewBox="0 0 24 24"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/></svg>
                <div>
                    <div style="color:var(--text-color); font-weight:bold;">ATTAQUE</div>
                    <div style="font-size:0.9rem; opacity:0.8;">Arretez le curseur dans la zone coloree.</div>
                </div>
            </div>
            <button class="btn-action" style="width:100%; margin-top:2rem;" onclick="game.startCombat()">C'EST PARTI</button>
        </div>

        <!-- 4. COMBAT SCREEN -->
        <div id="combat-screen" class="screen">
            <div id="arena">
                <div id="messages-layer" class="layer" style="z-index:70;"></div>
                <div id="qte-layer" style="position:absolute; inset:0; z-index:60;"></div>

                <div id="alert-box" style="position:absolute; top:20px; background:rgba(0,0,0,0.8); border:1px solid var(--accent); color:var(--accent); padding:5px 15px; font-weight:bold; letter-spacing:0.2em; opacity:0; transition:opacity 0.2s; z-index:55;">
                    DEFENSE REQUISE !
                </div>

                <!-- Ennemi : Le Drac -->
                <div id="enemy-visual" style="position:relative; transition:0.2s;">
                    <svg class="icon-huge" style="color:#4a4a35;" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">
                        <svg class="icon-xl" style="color:#ece4cb;" viewBox="0 0 24 24"><path d="M9 3h6l2 7H7l2-7z"/><path d="M12 10v8"/><path d="M8 18h8"/><circle cx="9.5" cy="6" r="0.5"/><circle cx="14.5" cy="6" r="0.5"/></svg>
                    </div>
                </div>

                <div id="enemy-hp-bar">
                    <div id="enemy-hp-fill"></div>
                </div>
            </div>

            <div id="controls">
                <div id="player-hud">
                    <div>
                        <div id="player-hp">100</div>
                        <div style="font-size:10px; opacity:0.5; letter-spacing:0.2em;">SANTE</div>
                    </div>
                    <div id="support-badge" style="display:none; color:var(--ally); border:1px solid var(--ally); background:rgba(129,203,214,0.1); padding:2px 6px; font-size:10px; border-radius:4px;">
                        ENVIRONNEMENT
                    </div>
                </div>

                <div id="action-area">
                    <button id="btn-assault" class="combat-btn active" onmousedown="game.startAiming()" ontouchstart="game.startAiming(event)">
                        <svg class="icon-lg" viewBox="0 0 24 24"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/></svg>
                        FRAPPER
                    </button>

                    <div id="precision-bar" onmousedown="game.executeAttack()" ontouchstart="game.executeAttack(event)">
                        <div class="p-zone-hit"></div>
                        <div class="p-zone-crit"></div>
                        <div id="p-cursor" class="p-cursor"></div>
                        <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;">
                            <span style="font-size:2rem; font-weight:bold; letter-spacing:0.2em; mix-blend-mode:overlay;">TAP !</span>
                        </div>
                    </div>

                    <div id="state-defense">
                        <svg class="icon-lg animate-pulse" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                        <span style="font-size:0.9rem; margin-top:0.5rem; letter-spacing:0.1em;">TOUCHEZ LES CIBLES !</span>
                    </div>

                    <div id="state-waiting" style="display:none; width:100%; height:100%; align-items:center; justify-content:center; opacity:0.5;">
                        <div style="width:20px; height:20px; border:2px solid var(--accent); border-top:transparent; border-radius:50%; animation:spin 1s linear infinite;"></div>
                    </div>
                </div>
                <div style="text-align:center; font-size:10px; color:#444; margin-top:8px; letter-spacing:0.2em;">SYSTEME SYNCHRONISE</div>
            </div>
        </div>

        <!-- 5. END SCREEN -->
        <div id="end-screen" class="screen">
            <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; background:rgba(0,0,0,0.8);">
                <div id="end-icon" style="margin-bottom:1rem;"></div>
                <h1 id="end-title" style="font-size:2.5rem; margin-bottom:1rem; text-transform:uppercase;"></h1>
                <p id="end-msg" style="color:#888; margin-bottom:2rem;"></p>
                <button id="end-btn" class="btn-action" style="width:100%; max-width:300px;"></button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
