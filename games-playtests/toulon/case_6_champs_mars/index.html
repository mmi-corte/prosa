<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Champ de Mars - PROSA</title>
    <style>
        /* --- POLICES --- */
        @font-face { 
            font-family: 'Futura'; 
            src: local('Futura'), url('/assets/fonts/futuramediumcondensedbt.ttf') format('truetype'); 
            font-weight: 400; font-style: normal; font-display: swap;
        } 
        @font-face { 
            font-family: 'Futura'; 
            src: local('Futura Bold'), url('/assets/fonts/futuramediumcondensedbt.ttf') format('truetype'); 
            font-weight: 700; font-style: normal; font-display: swap;
        }

        /* --- VARIABLES --- */
        :root { 
            --bg-app: #0d0c09;
            --bg-card: #EFE6D5;
            --text-card: #1C1A11;
            --ui-dark: #1C1A11;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --radius: 20px;
        }

        /* --- RESET MOBILE STRICT --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-app);
            font-family: 'Futura', sans-serif;
            height: 100dvh; /* Dynamic Height pour mobile */
            width: 100vw;
            overflow: hidden; /* Zéro scroll */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* On commence en haut pour gérer le header */
            touch-action: none; /* Bloque le zoom/pan */
            overscroll-behavior: none; /* Bloque le rebond iOS */
        }

        /* --- HEADER --- */
        header {
            height: 60px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0; /* Ne rétrécit jamais */
            z-index: 10;
        }
        .logo {
            color: #EFE6D5; font-weight: 700; letter-spacing: 4px; font-size: 1.2rem; opacity: 0.9;
        }

        /* --- CONTENEUR DU JEU --- */
        #game-card {
            flex: 1; /* Prend tout l'espace restant */
            width: 94vw; /* Marges latérales fines */
            max-width: 500px; /* Limite tablette */
            margin-bottom: 20px; /* Marge bas */
            background-color: var(--bg-card);
            border-radius: var(--radius);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex; flex-direction: column;
        }

        /* --- VIEWPORT JEU --- */
        #viewport {
            width: 100%; height: 100%;
            position: relative;
            background: linear-gradient(to bottom, #1a1812 65%, #14120e 65%);
            overflow: hidden;
            opacity: 0; transition: opacity 0.5s;
        }
        #viewport.active { opacity: 1; }

        /* DÉCOR */
        .skyline {
            position: absolute; bottom: 35%; left: 0; width: 200%; height: 20%;
            background: repeating-linear-gradient(90deg, #252218 0px, #252218 10px, transparent 10px, transparent 30px);
            opacity: 0.2;
        }
        
        /* RAILS OPTIMISÉS */
        .rails {
            position: absolute; bottom: 12%; width: 100%; height: 10px;
            background: repeating-linear-gradient(90deg, #3a3830 0, #3a3830 5px, transparent 5px, transparent 40px);
            border-top: 3px solid #555; border-bottom: 3px solid #555;
        }

        /* TRAIN & WAGONS */
        #train-track {
            position: absolute; bottom: 17%; left: 0; width: 100%; height: 120px;
            pointer-events: none;
        }

        .wagon {
            position: absolute; bottom: 0;
            width: 240px; height: 120px; /* Dimensions adaptées mobile */
            background-color: #26241b;
            border: 1px solid #000;
            border-radius: 2px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
        }
        /* Connecteurs entre wagons */
        .wagon::before {
            content: ''; position: absolute; bottom: 10px; left: -10px; width: 10px; height: 6px; background: #333;
        }
        /* Roues */
        .wagon::after {
            content: ''; position: absolute; bottom: -8px; left: 15px; right: 15px; height: 8px;
            background: repeating-linear-gradient(90deg, #111 0, #111 15px, transparent 15px, transparent 180px);
        }

        /* PORTES */
        .door {
            width: 60px; height: 90px;
            background: #1a1812;
            border: 2px solid #333;
            position: relative;
        }
        .door.open {
            background-color: #000;
            border-color: var(--accent-green);
            box-shadow: inset 0 0 15px rgba(0,255,0,0.1);
        }
        /* Signal lumineux vert au dessus de la porte ouverte */
        .door.open::before {
            content: ''; position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* JOUEUR */
        #player {
            position: absolute; bottom: 17%; left: 15%; /* Fixe à gauche */
            width: 24px; height: 50px;
            background-color: #EFE6D5;
            border-radius: 3px;
            z-index: 100;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        /* Marqueur de position au sol pour aider à viser */
        #jump-marker {
            position: absolute; bottom: 17%; left: 15%;
            width: 24px; height: 3px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transform: translateY(55px);
        }

        /* ANIMATIONS */
        .anim-jump { animation: jump-in 0.5s forwards ease-out; }
        .anim-shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes jump-in {
            0% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.1) translateY(-40px); }
            100% { transform: scale(0.5) translateY(-20px); opacity: 0; }
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* --- UI OVERLAYS --- */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 30px;
            background-color: var(--bg-card);
            color: var(--text-card);
            z-index: 50;
            text-align: center;
            transition: transform 0.3s ease-in-out, opacity 0.3s;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }

        h1 { font-size: 2.5rem; line-height: 1; margin-bottom: 5px; text-transform: uppercase; color: var(--ui-dark); }
        h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; margin-bottom: 30px; }

        /* BOUTONS APP STYLE */
        .btn-start {
            width: 100%; max-width: 280px;
            background: var(--ui-dark); color: var(--bg-card);
            padding: 20px; border-radius: 12px;
            font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 1rem;
            margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-start:active { transform: scale(0.96); }

        /* TUTORIEL VISUEL */
        .tuto-container {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; width: 100%;
        }
        .tuto-box {
            background: rgba(0,0,0,0.03); padding: 15px; border-radius: 10px; width: 100px;
        }
        .tuto-icon {
            width: 30px; height: 50px; border: 2px solid #333; margin: 0 auto 10px; display: block;
        }
        .tuto-label { font-size: 0.8rem; font-weight: bold; display: block; }
        
        .icon-ok { background: #000; border-color: var(--accent-green); }
        .icon-no { background: #333; opacity: 0.4; }

        /* ÉCRAN DE FIN */
        #screen-end {
            background-color: var(--ui-dark); color: var(--bg-card);
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #screen-end.visible { transform: translateY(0); }

        .end-status { font-size: 3.5rem; font-weight: 700; margin-bottom: 10px; line-height: 1; }
        .end-desc { font-size: 1.1rem; opacity: 0.8; margin-bottom: 30px; }

        .dialogue-box {
            background: rgba(255,255,255,0.1); border-left: 4px solid var(--bg-card);
            padding: 15px; margin-bottom: 30px; text-align: left; font-style: italic;
        }

    </style>
</head>
<body>

    <div id="game-card">
        
        <!-- JEU VIEWPORT -->
        <div id="viewport">
            <div class="skyline"></div>
            <div class="rails"></div>
            
            <div id="train-track">
                <!-- Wagons générés en JS -->
            </div>

            <div id="jump-marker"></div>
            <div id="player"></div>
        </div>

        <!-- MENU -->
        <div id="screen-menu" class="overlay">
            <h1>Champ<br>de Mars</h1>
            <h2>Mission 5.1</h2>
            
            <div class="tuto-container">
                <div class="tuto-box">
                    <div class="tuto-icon icon-ok"></div>
                    <span class="tuto-label" style="color:var(--accent-green)">OUVERT</span>
                    <span style="font-size:0.7rem">SAUTE</span>
                </div>
                <div class="tuto-box">
                    <div class="tuto-icon icon-no"></div>
                    <span class="tuto-label" style="color:var(--accent-red)">FERMÉ</span>
                    <span style="font-size:0.7rem">ATTENDS</span>
                </div>
            </div>

            <p style="font-size: 0.9rem; opacity: 0.6; margin-bottom: 10px;">Touchez l'écran pour sauter</p>
            <div class="btn-start" id="btn-play">COMMENCER</div>
        </div>

        <!-- FIN -->
        <div id="screen-end" class="overlay">
            <div class="end-status" id="end-title">?</div>
            <div class="end-desc" id="end-msg">...</div>
            
            <div id="story-content" style="display:none; width: 100%;">
                <div class="dialogue-box">
                    « On voulait juste manger… c’était pour l’anniversaire de notre mère. »
                </div>
            </div>

            <div class="btn-start" id="btn-action" style="background: var(--bg-card); color: var(--ui-dark);">
                ACTION
            </div>
        </div>

    </div>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            speed: 7, // Vitesse un peu plus lente pour mobile
            wagonWidth: 240,
            gap: 20,
            totalWagons: 12
        };

        // --- DOM ---
        const els = {
            viewport: document.getElementById('viewport'),
            track: document.getElementById('train-track'),
            player: document.getElementById('player'),
            menu: document.getElementById('screen-menu'),
            end: document.getElementById('screen-end'),
            endTitle: document.getElementById('end-title'),
            endMsg: document.getElementById('end-msg'),
            story: document.getElementById('story-content'),
            btnPlay: document.getElementById('btn-play'),
            btnAction: document.getElementById('btn-action'),
            card: document.getElementById('game-card')
        };

        // --- STATE ---
        let state = {
            running: false,
            wagons: [],
            spawned: 0,
            frameId: null
        };

        // --- INIT ---
        function init() {
            els.btnPlay.addEventListener('click', startGame);
            
            // Gestionnaire de saut unifié (Touch + Mouse)
            const jumpHandler = (e) => {
                if (!state.running) return;
                e.preventDefault(); // Stop zoom/scroll
                e.stopPropagation();
                attemptJump();
            };

            // Écouteur sur toute la carte pour maximiser la zone de touche
            els.card.addEventListener('touchstart', jumpHandler, { passive: false });
            els.card.addEventListener('mousedown', jumpHandler);
        }

        function startGame() {
            // Reset UI
            els.menu.classList.add('hidden');
            els.end.classList.remove('visible');
            els.viewport.classList.add('active');
            
            // Reset Data
            state.running = true;
            state.wagons = [];
            state.spawned = 0;
            els.track.innerHTML = '';
            els.player.classList.remove('anim-jump');
            els.player.style.opacity = 1;

            // Spawn initial
            let startX = 500; // Hors écran à droite
            for(let i=0; i<3; i++) {
                spawnWagon(startX + (i * (CONFIG.wagonWidth + CONFIG.gap)));
            }

            loop();
        }

        function spawnWagon(x) {
            if (state.spawned >= CONFIG.totalWagons) return;

            const el = document.createElement('div');
            el.className = 'wagon';
            el.style.left = x + 'px';

            // Porte
            const door = document.createElement('div');
            door.className = 'door';
            
            // 35% de chance d'ouverture
            const isOpen = Math.random() > 0.65;
            if (isOpen) door.classList.add('open');
            
            el.appendChild(door);
            els.track.appendChild(el);

            state.wagons.push({ el, x, isOpen });
            state.spawned++;
        }

        function loop() {
            if (!state.running) return;

            // Mouvement
            state.wagons.forEach(w => {
                w.x -= CONFIG.speed;
                w.el.style.left = w.x + 'px';
            });

            // Nettoyage (Sortie gauche)
            if (state.wagons.length > 0 && state.wagons[0].x < -(CONFIG.wagonWidth + 100)) {
                state.wagons[0].el.remove();
                state.wagons.shift();
            }

            // Spawn continu
            const last = state.wagons[state.wagons.length - 1];
            if (last && last.x < 500 && state.spawned < CONFIG.totalWagons) {
                spawnWagon(last.x + CONFIG.wagonWidth + CONFIG.gap);
            }

            // Check Fin (Train passé)
            if (state.wagons.length === 0 && state.spawned >= CONFIG.totalWagons) {
                gameOver(false, "TROP TARD", "Le train est passé.");
                return;
            }

            state.frameId = requestAnimationFrame(loop);
        }

        function attemptJump() {
            if (!state.running) return;
            state.running = false; // Stop input

            els.player.classList.add('anim-jump');

            // --- DETECT COLLISION ---
            // Zone joueur : Left 15% (environ 50-60px sur mobile) + largeur joueur
            const playerRect = els.player.getBoundingClientRect();
            const pX = playerRect.left + (playerRect.width / 2);

            let result = 'miss'; // 'win', 'hit', 'miss'

            const target = state.wagons.find(w => {
                const wRect = w.el.getBoundingClientRect();
                return pX >= wRect.left && pX <= wRect.right;
            });

            if (target) {
                const wRect = target.el.getBoundingClientRect();
                // La porte est au centre du wagon (wagon 240, porte 60 -> marge 90)
                const doorLeft = wRect.left + 90;
                const doorRight = wRect.left + 150;
                
                // Tolérance généreuse (+/- 15px)
                if (pX >= doorLeft - 15 && pX <= doorRight + 15) {
                    result = target.isOpen ? 'win' : 'hit';
                } else {
                    result = 'hit';
                }
            } else {
                result = 'miss';
            }

            // --- RESULTAT ---
            setTimeout(() => {
                if (result === 'win') {
                    gameOver(true, "SUCCÈS", "Infiltration réussie.");
                } else if (result === 'hit') {
                    els.card.classList.add('anim-shake');
                    setTimeout(()=>els.card.classList.remove('anim-shake'), 400);
                    gameOver(false, "IMPACT", "Tu as heurté le wagon.");
                } else {
                    gameOver(false, "OUPS", "Saut dans le vide.");
                }
            }, 400);
        }

        function gameOver(win, title, msg) {
            cancelAnimationFrame(state.frameId);
            state.running = false;

            els.endTitle.innerText = title;
            els.endMsg.innerText = msg;

            if (win) {
                els.endTitle.style.color = "var(--accent-green)";
                els.story.style.display = "block";
                els.btnAction.innerText = "CONTINUER";
                els.btnAction.onclick = () => { window.parent.postMessage({type:'minigame-complete',success:true},'*'); };
                els.btnAction.style.background = "var(--accent-green)";
                els.btnAction.style.color = "#fff";
                // Remove abandon button if exists
                const existingAbandon = els.end.querySelector('.abandon-btn');
                if (existingAbandon) existingAbandon.remove();
            } else {
                els.endTitle.style.color = "var(--accent-red)";
                els.story.style.display = "none";
                els.btnAction.innerText = "RÉESSAYER";
                els.btnAction.onclick = startGame;
                els.btnAction.style.background = "var(--bg-card)";
                els.btnAction.style.color = "var(--ui-dark)";
                // Add abandon button
                if (!els.end.querySelector('.abandon-btn')) {
                    const abandonBtn = document.createElement('button');
                    abandonBtn.className = 'abandon-btn';
                    abandonBtn.innerText = 'ABANDONNER';
                    abandonBtn.style.cssText = 'background:transparent;color:#888;border:1px solid #555;padding:12px 24px;font-family:inherit;font-size:0.9rem;cursor:pointer;margin-top:10px;text-transform:uppercase;';
                    abandonBtn.onclick = () => { window.parent.postMessage({type:'minigame-complete',success:false},'*'); };
                    els.btnAction.parentNode.insertBefore(abandonBtn, els.btnAction.nextSibling);
                }
            }

            setTimeout(() => els.end.classList.add('visible'), 500);
        }

        init();

    </script>
</body>
</html>
