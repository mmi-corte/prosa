<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prosa - Case 10 : La Mairie</title>
    <style>
        /* --- POLICES ET VARIABLES --- */ 
        @font-face { 
            font-family: 'Futura'; 
            src: url('/assets/fonts/futuramediumcondensedbt.ttf') format('truetype'), 
            url('/assets/fonts/FuturaCondMedium.woff2') format('woff2'), 
            url('/assets/fonts/FuturaCondMedium.woff') format('woff'); 
            font-weight: 400; 
            font-style: normal; 
            font-display: fallback; 
        } 

        @font-face { 
            font-family: 'Futura'; 
            src: url('/assets/fonts/futuramediumcondensedbt.ttf') format('truetype'), 
            url('/assets/fonts/FuturaCondMedium.woff2') format('woff2'), 
            url('/assets/fonts/FuturaCondMedium.woff') format('woff'); 
            font-weight: 700; 
            font-style: normal; 
            font-display: fallback; 
        }

        :root { 
            --background: #1a1812; 
            --foreground: #ece4cb; 
            --card: #252218; 
            --card-foreground: #ece4cb; 
            --primary: #626247; 
            --primary-dark: #4a4a35; 
            --primary-light: #7a7a5a; 
            --secondary: #300941; 
            --muted: #2a2820; 
            --muted-foreground: #9a9680; 
            --accent-red: #c63032; 
            --accent-green: #81cbd6; 
            --dust: #ece4cb; 
            --border: #3a3830; 
            --yellow: #ffdb2c; 
            --cyan: #81cbd6;
        }

        /* --- RESET & STRUCTURE --- */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--background);
            color: var(--foreground);
            font-family: 'Futura', 'Arial Narrow', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- UI CONTAINERS --- */
        #game-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 900px;
            position: relative;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #252218 0%, #0f0e0b 100%);
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* EFFET SCANLINES */
        #game-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* PARTICLES BACKGROUND */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.4;
        }

        /* --- SCREENS --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly; /* Better spacing vertical */
            align-items: center;
            padding: 2rem;
            text-align: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: 10;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
            z-index: -1;
        }

        h1 {
            font-size: 3rem;
            color: var(--yellow);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 219, 44, 0.3);
        }

        h2 {
            font-size: 1.2rem;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--accent-green);
            padding-bottom: 5px;
        }

        /* --- BUTTONS --- */
        .btn {
            background: linear-gradient(45deg, var(--primary-dark), var(--primary));
            color: var(--foreground);
            border: 1px solid var(--border);
            padding: 1.2rem 3.5rem;
            font-size: 1.3rem;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            z-index: 20;
        }
        
        .btn:active {
            transform: scale(0.95);
        }

        /* --- HUD --- */
        .hud-top {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            font-family: monospace;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .lives-container {
            display: flex;
            gap: 10px;
        }

        .life-icon {
            width: 18px;
            height: 18px;
            background-color: var(--accent-green);
            transform: rotate(45deg);
            box-shadow: 0 0 8px var(--accent-green);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .life-icon.lost {
            background-color: transparent;
            border: 1px solid var(--muted-foreground);
            box-shadow: none;
            opacity: 0.3;
        }

        /* --- VISUAL CONTEXT (MAIRIE) --- */
        .fortress-container {
            width: 100%;
            flex-grow: 1; /* Takes available space */
            max-height: 40%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0.2;
            transition: opacity 0.5s, transform 0.5s;
            z-index: 1;
        }

        .fortress-body {
            width: 160px;
            height: 120px;
            background: linear-gradient(to top, var(--muted) 0%, #111 100%);
            border: 2px solid var(--primary-dark);
            position: relative;
            z-index: 1;
            clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .tower {
            width: 50px;
            height: 180px;
            background: linear-gradient(to top, var(--card) 0%, #111 100%);
            border: 2px solid var(--primary-dark);
            position: absolute;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            gap: 15px;
        }
        .tower.left { left: calc(50% - 130px); clip-path: polygon(0 15%, 100% 0, 100% 100%, 0% 100%); }
        .tower.right { right: calc(50% - 130px); clip-path: polygon(0 0, 100% 15%, 100% 100%, 0% 100%); }

        .window {
            width: 14px;
            height: 24px;
            background: #0f0f0f;
            box-shadow: inset 0 0 5px rgba(0,0,0,1);
            transition: background 0.5s, box-shadow 0.5s;
        }
        
        .window.lit {
            background: var(--yellow);
            box-shadow: 0 0 15px var(--yellow);
        }

        /* --- THE GAME BAR --- */
        .game-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 20;
            padding-bottom: 40px; /* Lift it up a bit */
        }

        .bar-container {
            width: 85%;
            max-width: 450px;
            height: 60px; /* Taller for better visual impact */
            background-color: rgba(26, 24, 18, 0.9);
            border: 2px solid var(--muted-foreground);
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            margin-bottom: 2rem;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        /* Active glow when cursor is in zone (handled by JS) */
        .bar-container.zone-active {
            border-color: rgba(129, 203, 214, 0.6);
            box-shadow: 0 0 15px rgba(129, 203, 214, 0.2);
        }

        .target-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 22%; /* NARROWER (Harder) */
            background-color: rgba(129, 203, 214, 0.1);
            border-left: 2px solid var(--cyan);
            border-right: 2px solid var(--cyan);
            z-index: 1;
            box-shadow: 0 0 10px rgba(129, 203, 214, 0.1);
        }
        
        /* Center line helper */
        .target-zone::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 1px;
            background: rgba(129, 203, 214, 0.3);
            transform: translateX(-50%);
        }

        .cursor {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: var(--accent-red);
            left: 0%;
            z-index: 2;
            box-shadow: 0 0 15px var(--accent-red), 0 0 5px white;
            will-change: left;
        }

        /* Full screen trigger for mobile */
        #mobile-trigger-zone {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* FIX 1: Z-Index très élevé pour être AU DESSUS de game-area (20) et capter le touch */
            z-index: 100;
            display: none;
            /* FIX 2: touch-action none pour désactiver les délais du navigateur */
            touch-action: none;
        }

        /* Progress Dots below bar */
        .progress-dots {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: #2a2820;
            border: 2px solid var(--muted-foreground);
            transform: rotate(45deg);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .dot.active {
            background-color: var(--yellow);
            border-color: var(--yellow);
            box-shadow: 0 0 12px var(--yellow);
            transform: rotate(45deg) scale(1.2);
        }

        /* Text Instruction */
        .tap-instruction {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted-foreground);
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.6;
        }

        /* --- FEEDBACK EFFECTS --- */
        
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-4px, 0, 0); }
            20%, 80% { transform: translate3d(8px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        #damage-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(198, 48, 50, 0.5) 100%);
            opacity: 0;
            pointer-events: none;
            z-index: 15;
            transition: opacity 0.2s;
        }
        
        .damaged #damage-overlay {
            opacity: 1;
        }

        /* Success Burst Effect */
        .success-burst {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(129, 203, 214, 0.8) 0%, transparent 70%);
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 25;
            animation: burst 0.4s ease-out forwards;
        }

        @keyframes burst {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="game-container">
        <!-- Visual Effects Layer -->
        <canvas id="particles"></canvas>
        <div id="damage-overlay"></div>
        <div id="mobile-trigger-zone"></div>
        
        <!-- ÉCRAN D'ACCUEIL -->
        <div id="start-screen" class="screen">
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <h1>LA MAIRIE</h1>
                <h2>CASE 10</h2>
                <div style="width: 50px; height: 4px; background: var(--primary); margin: 20px auto;"></div>
            </div>
            
            <div style="flex: 1;">
                <p style="color: var(--dust); max-width: 400px; margin: 0 auto;">
                    <strong>MISSION :</strong> Synchronisez vos mouvements pour avancer dans l'ombre sans alerter les gardes.
                </p>
            </div>
            
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <p style="font-size: 0.8rem; margin-bottom: 20px; color: var(--accent-green); text-transform: uppercase; letter-spacing: 2px;">
                    3 essais disponibles
                </p>
                <button class="btn" onclick="startGame()">COMMENCER</button>
            </div>
        </div>

        <!-- ÉCRAN DE JEU -->
        <div id="game-screen" class="screen hidden" style="padding: 0;">
            
            <div class="hud-top">
                <div class="lives-container" id="lives-display">
                    <div class="life-icon"></div>
                    <div class="life-icon"></div>
                    <div class="life-icon"></div>
                </div>
                <div style="color: var(--muted-foreground); letter-spacing: 2px;">
                    <span style="color:var(--yellow)" id="score-display">0</span> / 5
                </div>
            </div>

            <div class="fortress-container" id="fortress-visual">
                <div class="tower left">
                     <div class="window"></div><div class="window"></div><div class="window"></div>
                </div>
                <div class="fortress-body">
                    <div class="window" style="margin-bottom: 10px;"></div>
                    <div class="window"></div>
                </div>
                <div class="tower right">
                    <div class="window"></div><div class="window"></div><div class="window"></div>
                </div>
            </div>

            <div class="game-area">
                <!-- Wrapper for bar to handle click effects -->
                <div style="position: relative; width: 100%; display: flex; justify-content: center;">
                    <div class="bar-container" id="bar-container">
                        <div class="target-zone"></div>
                        <div class="cursor" id="cursor"></div>
                    </div>
                </div>

                <div class="progress-dots" id="progress-container">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                
                <div class="tap-instruction">TAPPEZ POUR AVANCER</div>
            </div>
        </div>

        <!-- ÉCRAN DE VICTOIRE -->
        <div id="win-screen" class="screen hidden">
            <h1 style="color: var(--accent-green)">INFILTRATION RÉUSSIE</h1>
            <div style="width: 80px; height: 80px; margin: 30px auto; border: 4px solid var(--accent-green); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <div style="width: 25px; height: 40px; border-bottom: 6px solid var(--accent-green); border-right: 6px solid var(--accent-green); transform: rotate(45deg) translate(-4px, -4px);"></div>
            </div>
            <p>Vous avez atteint les portes sans bruit.</p>
            <button class="btn" onclick="if(window.finishGame) window.finishGame(true); else ((new URLSearchParams(window.location.search)).get('from')==='minigames' ? window.location.href='../../../index.html#univers-prosa/mini-jeux' : history.back())">CONTINUER</button>
        </div>

        <!-- ÉCRAN DE DÉFAITE -->
        <div id="lose-screen" class="screen hidden">
            <h1 style="color: var(--accent-red)">ÉCHEC</h1>
            <div style="width: 80px; height: 80px; margin: 30px auto; border: 4px solid var(--accent-red); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <div style="font-size: 50px; color: var(--accent-red); font-weight: bold;">!</div>
            </div>
            <p>L'alarme a été déclenchée.</p>
            <button class="btn" onclick="if(window.finishGame) window.finishGame(false); else ((new URLSearchParams(window.location.search)).get('from')==='minigames' ? window.location.href='../../../index.html#univers-prosa/mini-jeux' : history.back())">CONTINUER</button>
        </div>

    </div>

    <script>
        // --- PARTICLES SYSTEM ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.color = 'rgba(236, 228, 203, ' + (Math.random() * 0.15 + 0.05) + ')'; 
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < 40; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();


        // --- GAME VARIABLES ---
        const gameState = {
            isPlaying: false,
            score: 0,
            targetScore: 5,
            lives: 3,
            maxLives: 3,
            cursorPos: 0, 
            direction: 1, 
            speed: 0.85, // HARDER: Started at 0.7, now 0.85
            baseSpeed: 0.85, 
            animationId: null,
            isHurting: false
        };

        // --- DOM ELEMENTS ---
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            win: document.getElementById('win-screen'),
            lose: document.getElementById('lose-screen')
        };
        
        const cursorElement = document.getElementById('cursor');
        const gameContainer = document.getElementById('game-container');
        const fortressVisual = document.getElementById('fortress-visual');
        const dots = document.querySelectorAll('.dot');
        const lifeIcons = document.querySelectorAll('.life-icon');
        const scoreDisplay = document.getElementById('score-display');
        const mobileTrigger = document.getElementById('mobile-trigger-zone');
        const barContainer = document.getElementById('bar-container');

        // --- LOGIC ---

        function startGame() {
            gameState.score = 0;
            gameState.lives = gameState.maxLives;
            gameState.speed = gameState.baseSpeed;
            gameState.cursorPos = 0;
            gameState.direction = 1;
            gameState.isPlaying = true;
            gameState.isHurting = false;

            updateUI();
            updateLivesUI();
            
            // Fortress Reset
            fortressVisual.style.opacity = 0.2;
            fortressVisual.style.transform = 'scale(0.8)';
            document.querySelectorAll('.window').forEach(w => w.classList.remove('lit'));

            mobileTrigger.style.display = 'block';
            
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens.game.classList.remove('hidden');

            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        let lastTime = 0;

        function gameLoop(timestamp) {
            if (!gameState.isPlaying) return;

            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            const moveAmount = (gameState.speed * deltaTime) * 0.15; 
            gameState.cursorPos += moveAmount * gameState.direction;

            if (gameState.cursorPos >= 100) {
                gameState.cursorPos = 100;
                gameState.direction = -1;
            } else if (gameState.cursorPos <= 0) {
                gameState.cursorPos = 0;
                gameState.direction = 1;
            }

            // Visual Check for Active Zone Glow
            // Target Width is 22%, centered at 50% -> Range 39 to 61
            if (gameState.cursorPos >= 39 && gameState.cursorPos <= 61) {
                barContainer.classList.add('zone-active');
            } else {
                barContainer.classList.remove('zone-active');
            }

            cursorElement.style.left = gameState.cursorPos + '%';
            gameState.animationId = requestAnimationFrame(gameLoop);
        }

        function createBurst(x, y) {
            const burst = document.createElement('div');
            burst.classList.add('success-burst');
            burst.style.left = x + 'px';
            burst.style.top = y + 'px';
            document.body.appendChild(burst);
            setTimeout(() => burst.remove(), 500);
        }

        function handleAction(e) {
            if(e) e.preventDefault();
            if(e) e.stopPropagation();

            if (!gameState.isPlaying || gameState.isHurting) return;

            // Target Zone Calculation (HARDER)
            // Center 50, Width 22 -> 39 to 61
            const hitStart = 39;
            const hitEnd = 61;

            // Visual Burst Position
            const barRect = barContainer.getBoundingClientRect();
            // Calculate pixel position of cursor relative to viewport for the burst
            const burstX = barRect.left + (barRect.width * (gameState.cursorPos / 100));
            const burstY = barRect.top + (barRect.height / 2);

            if (gameState.cursorPos >= hitStart && gameState.cursorPos <= hitEnd) {
                successHit(burstX, burstY);
            } else {
                failHit();
            }
        }

        function successHit(x, y) {
            gameState.score++;
            updateUI();
            createBurst(x, y);

            gameState.speed *= 1.2; 
            
            // Fortress Visuals
            const progress = gameState.score / gameState.targetScore;
            fortressVisual.style.opacity = 0.2 + (progress * 0.8);
            fortressVisual.style.transform = `scale(${0.8 + (progress * 0.3)}) translateY(-${progress * 20}px)`; // Moves up and grows
            
            // Light up random windows
            const windows = Array.from(document.querySelectorAll('.window'));
            const unlitWindows = windows.filter(w => !w.classList.contains('lit'));
            if(unlitWindows.length > 0) {
                // Light up 2 windows per success for dramatic effect
                unlitWindows[Math.floor(Math.random() * unlitWindows.length)].classList.add('lit');
                if(unlitWindows.length > 1) {
                     unlitWindows[Math.floor(Math.random() * unlitWindows.length)].classList.add('lit');
                }
            }

            // Randomize restart
            if(gameState.direction === 1) gameState.cursorPos = 0;
            else gameState.cursorPos = 100;

            if (gameState.score >= gameState.targetScore) {
                setTimeout(() => endGame(true), 200);
            }
        }

        function failHit() {
            if(gameState.isHurting) return;
            gameState.isHurting = true;
            gameState.lives--;
            updateLivesUI();

            gameContainer.classList.add('shake');
            gameContainer.classList.add('damaged');
            
            setTimeout(() => {
                gameContainer.classList.remove('shake');
                gameContainer.classList.remove('damaged');
                gameState.isHurting = false;
            }, 500);

            if (gameState.lives <= 0) {
                endGame(false);
            }
        }

        function updateUI() {
            scoreDisplay.textContent = gameState.score;
            dots.forEach((dot, index) => {
                if (index < gameState.score) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function updateLivesUI() {
            lifeIcons.forEach((icon, index) => {
                if (index < gameState.lives) {
                    icon.classList.remove('lost');
                } else {
                    icon.classList.add('lost');
                }
            });
        }

        function endGame(victory) {
            gameState.isPlaying = false;
            cancelAnimationFrame(gameState.animationId);
            mobileTrigger.style.display = 'none';

            screens.game.classList.add('hidden');
            setTimeout(() => {
                if (victory) {
                    screens.win.classList.remove('hidden');
                } else {
                    screens.lose.classList.remove('hidden');
                }
            }, 300);
        }

        function resetGame() {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens.start.classList.remove('hidden');
        }

        // --- CONTROLS ---
        mobileTrigger.addEventListener('touchstart', handleAction, {passive: false});
        // FIX 3: Ajout d'écouteurs directs sur les conteneurs de jeu au cas où
        barContainer.addEventListener('touchstart', handleAction, {passive: false});
        gameContainer.addEventListener('touchstart', (e) => {
           if(gameState.isPlaying) handleAction(e);
        }, {passive: false});

        // Souris fallback
        barContainer.addEventListener('mousedown', handleAction);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                if (gameState.isPlaying) {
                    handleAction();
                } else if (!screens.start.classList.contains('hidden')) {
                    startGame();
                } else if (!screens.win.classList.contains('hidden') || !screens.lose.classList.contains('hidden')) {
                    resetGame();
                }
            }
        });

    </script>
</body>
</html>
