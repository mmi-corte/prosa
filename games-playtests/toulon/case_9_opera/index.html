<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Case 7 : L'Opéra de Toulon</title>
    <style>
        /* --- FONTS --- */
        @font-face {
            font-family: 'Futura';
            src: url('/assets/fonts/futuramediumcondensedbt.ttf') format('truetype'),
                 url('/assets/fonts/FuturaCondMedium.woff2') format('woff2'),
                 url('/assets/fonts/FuturaCondMedium.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Futura';
            src: url('/assets/fonts/futuramediumcondensedbt.ttf') format('truetype'),
                 url('/assets/fonts/FuturaCondMedium.woff2') format('woff2'),
                 url('/assets/fonts/FuturaCondMedium.woff') format('woff');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        /* --- VARIABLES --- */
        :root {
            --bg-color: #1a1812;
            --card-bg: #252218;
            --text-main: #ece4cb;
            --text-muted: #9a9680;
            --primary: #626247;
            --primary-dark: #4a4a35;
            --accent-gold: #ffdb2c;
            --accent-red: #c63032;
            --accent-cyan: #81cbd6;
        }

        /* --- GLOBAL RESET --- */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; /* Empêche le zoom/scroll sur tout */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Futura', sans-serif;
            margin: 0;
            padding: 0;
            /* Utilisation de dvh pour mobile (évite les soucis de barre d'adresse) */
            height: 100dvh; 
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #2a2820 0%, #1a1812 100%);
        }

        /* --- LAYOUT PRINCIPAL --- */
        .game-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Répartit l'espace verticalement */
            align-items: center;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)) 20px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            width: 100%;
            margin-bottom: 10px;
        }

        h1 {
            font-size: clamp(1.5rem, 4vh, 2rem); /* Taille adaptative */
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0 0 5px 0;
            text-shadow: 0 0 10px rgba(255, 219, 44, 0.3);
        }

        .status-container {
            min-height: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-text {
            font-size: clamp(0.9rem, 2.5vh, 1.1rem);
            color: var(--text-muted);
            text-align: center;
            line-height: 1.3;
        }

        /* --- GRILLE JEU --- */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            width: 100%;
            aspect-ratio: 1/1; /* Force un carré global */
            max-height: 50vh; /* Ne jamais dépasser 50% de la hauteur */
            margin: 10px 0;
        }

        .pad {
            background: rgba(98, 98, 71, 0.1);
            border: 1px solid var(--primary);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .pad svg {
            width: 40%;
            height: 40%;
            stroke: var(--text-muted);
            stroke-width: 1.5;
            fill: none;
            transition: all 0.2s;
        }

        .pad span {
            margin-top: 8px;
            font-size: clamp(0.7rem, 2vh, 0.9rem);
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* États Actifs */
        .pad.active {
            border-color: var(--color);
            background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%);
            box-shadow: 0 0 20px var(--color-glow), inset 0 0 10px var(--color);
            transform: scale(0.96);
        }

        .pad.active svg {
            stroke: var(--text-main);
            stroke-width: 2.5;
            filter: drop-shadow(0 0 10px var(--color));
            transform: scale(1.1);
        }
        
        .pad.active span {
            color: var(--text-main);
            opacity: 1;
            text-shadow: 0 0 5px var(--color);
        }

        /* Couleurs */
        .pad[data-id="0"] { --color: #c63032; --color-glow: rgba(198, 48, 50, 0.4); }
        .pad[data-id="1"] { --color: #81cbd6; --color-glow: rgba(129, 203, 214, 0.4); }
        .pad[data-id="2"] { --color: #ffdb2c; --color-glow: rgba(255, 219, 44, 0.4); }
        .pad[data-id="3"] { --color: #ece4cb; --color-glow: rgba(236, 228, 203, 0.4); }

        /* --- BOUTON --- */
        .control-area {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-bottom: 10px;
        }

        .btn-main {
            background: linear-gradient(45deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 0;
            width: 100%;
            font-family: 'Futura', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: opacity 0.3s;
        }

        .btn-main:active {
            transform: scale(0.98);
        }
        
        .btn-main:disabled {
            opacity: 0.5;
            cursor: default;
        }

        /* --- VISUAL FX --- */
        .trapdoor-visual {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0;
            background: radial-gradient(circle at bottom, #300941 0%, #000 70%);
            transition: height 1.5s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
        }

        .trapdoor-visual.open {
            height: 100vh;
        }

        .victory-message {
            opacity: 0;
            color: var(--accent-gold);
            font-size: 2rem;
            text-transform: uppercase;
            text-align: center;
            transform: translateY(50px);
            transition: opacity 1s 0.5s, transform 1s 0.5s;
        }

        .trapdoor-visual.open .victory-message {
            opacity: 1;
            transform: translateY(0);
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-anim 0.6s linear;
            background: rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }

        @keyframes ripple-anim {
            to { transform: scale(3); opacity: 0; }
        }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

        /* Debug Switch */
        .debug-roseau {
            position: absolute;
            top: 10px;
            right: 10px;
            opacity: 0.1;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- OVERLAY VICTOIRE -->
    <div class="trapdoor-visual" id="trapdoor">
        <div class="victory-message">
            <div>La voie est libre</div>
            <div style="font-size: 1rem; margin-top: 20px; color: #fff; letter-spacing: 1px;">Vers Sébastien...</div>
        </div>
    </div>

    <!-- JEU -->
    <div class="game-wrapper" id="game-wrapper">
        
        <div class="debug-roseau">
            <label><input type="checkbox" id="roseau-toggle"> 🗝️</label>
        </div>

        <header>
            <h1>L'Opéra</h1>
            <div class="status-container">
                <div class="status-text" id="status">
                    Le silence règne...<br>Touchez pour tester, puis lancez l'épreuve.
                </div>
            </div>
        </header>

        <div class="grid-container" id="grid">
            <!-- onpointerdown est le plus fiable pour mobile moderne + PC -->
            <div class="pad" data-id="0" onpointerdown="handleInput(0, event)">
                <svg viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5v-3.5a2.5 2.5 0 0 0-5 0V21m5-13a4 4 0 0 0-8 0v3h8v-3Z"/><path d="M12 3v18"/></svg>
                <span>Violoncelle</span>
            </div>
            <div class="pad" data-id="1" onpointerdown="handleInput(1, event)">
                <svg viewBox="0 0 24 24"><path d="M2 12c0 5.5 4.5 10 10 10s10-4.5 10-10S17.5 2 12 2 2 6.5 2 12Z"/><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M8 15a4 4 0 0 0 8 0"/></svg>
                <span>Masque</span>
            </div>
            <div class="pad" data-id="2" onpointerdown="handleInput(2, event)">
                <svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M8 6h8"/><path d="M12 18l-4-4h8l-4 4Z"/><path d="M10 10l-2 2"/><path d="M14 10l2 2"/></svg>
                <span>Lustre</span>
            </div>
            <div class="pad" data-id="3" onpointerdown="handleInput(3, event)">
                <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                <span>Partition</span>
            </div>
        </div>

        <div class="control-area">
            <button class="btn-main" id="start-btn" onclick="startGame()">Commencer l'épreuve</button>
        </div>
    </div>

    <script>
        // --- ETAT DU JEU ---
        // Niveau de difficulté progressif
        const ROUNDS_CONFIG = [3, 4, 5]; // 3 notes, puis 4, puis 5
        let currentRoundIndex = 0;
        
        let gameSequence = [];
        let playerSequence = [];
        let isPlayingSequence = false;
        let isGameActive = false;
        let hasRoseau = false;
        let audioCtx = null;
        let masterGain = null;
        let delayNode = null;

        // --- DOM ---
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        const trapdoorEl = document.getElementById('trapdoor');
        const wrapperEl = document.getElementById('game-wrapper');

        // --- AUDIO ENGINE ---
        function initAudio() {
            if (audioCtx) {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                return;
            }
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // Effets
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.5;

            delayNode = audioCtx.createDelay();
            delayNode.delayTime.value = 0.25; 
            
            const feedbackGain = audioCtx.createGain();
            feedbackGain.gain.value = 0.3;

            masterGain.connect(audioCtx.destination);
            masterGain.connect(delayNode);
            delayNode.connect(feedbackGain);
            feedbackGain.connect(delayNode);
            delayNode.connect(audioCtx.destination);
        }

        function playTone(id) {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(e => console.log(e));

            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(masterGain);

            osc.start(t); // Start BEFORE config (safety)

            switch(id) {
                case 0: // Violoncelle
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(110, t);
                    osc.frequency.exponentialRampToValueAtTime(108, t + 0.5);
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.8, t + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.6);
                    osc.stop(t + 0.7);
                    break;
                case 1: // Masque
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, t);
                    osc.frequency.linearRampToValueAtTime(554, t + 0.2); 
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.6, t + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                    osc.stop(t + 0.6);
                    break;
                case 2: // Lustre
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1568, t);
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.4, t + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                    osc.stop(t + 0.6);
                    break;
                case 3: // Partition
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(220, t);
                    osc.frequency.linearRampToValueAtTime(110, t + 0.1);
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.4, t + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                    osc.stop(t + 0.4);
                    break;
            }
        }

        function playError() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(t);
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(60, t);
            osc.frequency.linearRampToValueAtTime(40, t + 0.4);
            gain.gain.setValueAtTime(0.5, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.4);
            
            osc.stop(t + 0.5);
        }

        // --- GAME LOGIC ---

        function checkRoseau() {
            if (hasRoseau) {
                statusEl.innerHTML = "<span style='color:var(--accent-cyan)'>Le Roseau vibre...</span><br>Le mécanisme s'ouvre.";
                startBtn.style.display = 'none';
                setTimeout(winGame, 1500);
            } else {
                // Reset UI
                startBtn.style.display = 'block';
                startBtn.disabled = false;
                startBtn.innerHTML = "COMMENCER L'ÉPREUVE";
                startBtn.style.opacity = '1';
                statusEl.innerHTML = "Le silence règne...<br>Touchez pour tester, puis lancez l'épreuve.";
                isGameActive = false;
                gameSequence = [];
            }
        }

        function startGame() {
            initAudio(); 
            isGameActive = true;
            startBtn.disabled = true;
            currentRoundIndex = 0; // Reset progression
            
            startRound();
        }

        function startRound() {
            const notesCount = ROUNDS_CONFIG[currentRoundIndex];
            
            statusEl.innerHTML = `SÉQUENCE ${currentRoundIndex + 1} / ${ROUNDS_CONFIG.length}<br>ÉCOUTEZ (${notesCount} NOTES)...`;
            startBtn.style.opacity = '0.5'; 
            
            gameSequence = [];
            playerSequence = [];
            
            // Generate sequence based on round difficulty
            for(let i=0; i<notesCount; i++) {
                gameSequence.push(Math.floor(Math.random() * 4));
            }

            setTimeout(playSequence, 1000);
        }

        function playSequence() {
            isPlayingSequence = true;
            let delay = 0;

            gameSequence.forEach((note, index) => {
                setTimeout(() => {
                    playTone(note);
                    triggerPad(note);
                }, delay);
                delay += 800;
            });

            setTimeout(() => {
                isPlayingSequence = false;
                statusEl.innerHTML = `SÉQUENCE ${currentRoundIndex + 1} / ${ROUNDS_CONFIG.length}<br>RÉPÉTEZ L'ÉCHO`;
                startBtn.style.opacity = '0';
                startBtn.style.pointerEvents = 'none';
            }, delay);
        }

        function handleInput(id, event) {
            if (isPlayingSequence) return;
            if (hasRoseau) return;

            // Feedback immédiat
            playTone(id);
            triggerPad(id, event);

            if (!isGameActive) return;

            // Logic
            playerSequence.push(id);
            const step = playerSequence.length - 1;

            if (playerSequence[step] !== gameSequence[step]) {
                gameOver();
            } else {
                // Sequence Complete?
                if (playerSequence.length === gameSequence.length) {
                    handleRoundSuccess();
                }
            }
        }

        function handleRoundSuccess() {
            isPlayingSequence = true; // Bloquer les inputs temporairement
            
            // Check if final round
            if (currentRoundIndex === ROUNDS_CONFIG.length - 1) {
                // VICTOIRE FINALE
                setTimeout(winGame, 500);
            } else {
                // MANCHE SUIVANTE
                statusEl.innerHTML = "<span style='color:var(--accent-cyan)'>ACCORD VALIDE</span>";
                
                // Le son intermédiaire a été supprimé

                setTimeout(() => {
                    currentRoundIndex++;
                    startRound();
                }, 1500);
            }
        }

        function triggerPad(id, event) {
            const pad = document.querySelector(`.pad[data-id="${id}"]`);
            if (!pad) return;

            pad.classList.add('active');
            setTimeout(() => pad.classList.remove('active'), 250);

            // Ripple
            const ripple = document.createElement("span");
            ripple.classList.add("ripple");
            const rect = pad.getBoundingClientRect();
            let x, y;
            if (event && event.isTrusted) {
                x = event.clientX - rect.left;
                y = event.clientY - rect.top;
            } else {
                x = rect.width / 2;
                y = rect.height / 2;
            }
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${x - size/2}px`;
            ripple.style.top = `${y - size/2}px`;
            pad.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        function gameOver() {
            playError();
            statusEl.innerHTML = "<span style='color:var(--accent-red)'>DISSONANCE !</span>";
            wrapperEl.classList.add('shake');
            isGameActive = false;

            setTimeout(() => {
                wrapperEl.classList.remove('shake');
                statusEl.innerHTML = "Concentrez-vous...";
                startBtn.innerHTML = "RÉESSAYER";
                startBtn.disabled = false;
                startBtn.style.opacity = '1';
                startBtn.style.pointerEvents = 'auto';
                // Add abandon button if not present
                if (!document.getElementById('abandon-btn')) {
                    const abandonBtn = document.createElement('button');
                    abandonBtn.id = 'abandon-btn';
                    abandonBtn.innerText = 'ABANDONNER';
                    abandonBtn.style.cssText = 'background:transparent;color:#888;border:1px solid #555;padding:10px 24px;font-family:inherit;font-size:0.9rem;cursor:pointer;margin-top:10px;';
                    abandonBtn.onclick = () => { ((new URLSearchParams(window.location.search)).get('from')==='minigames' ? window.location.href='../../../index.html#univers-prosa/mini-jeux' : history.back()); };
                    startBtn.parentNode.insertBefore(abandonBtn, startBtn.nextSibling);
                }
            }, 1000);
        }

        function winGame() {
            isGameActive = false;
            // Fanfare
            setTimeout(() => playTone(0), 0);
            setTimeout(() => playTone(2), 200);
            setTimeout(() => playTone(1), 400);

            statusEl.innerHTML = "";
            trapdoorEl.classList.add('open');

            setTimeout(() => {
                if (window.finishGame) window.finishGame(true); else ((new URLSearchParams(window.location.search)).get('from')==='minigames' ? window.location.href='../../../index.html#univers-prosa/mini-jeux' : history.back());
            }, 2000);
        }

        // --- INIT ---
        document.getElementById('roseau-toggle').addEventListener('change', (e) => {
            hasRoseau = e.target.checked;
            checkRoseau();
        });

        window.oncontextmenu = function(event) {
             event.preventDefault();
             event.stopPropagation();
             return false;
        };

        checkRoseau();

    </script>
</body>
</html>
