<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <style>
    .logo-text { font-family: 'Arial Black', sans-serif; font-weight: 900; font-size: 42px; fill: #1a1a1a; }
  </style>
  <!-- P R -->
  <text x="0" y="45" class="logo-text">PR</text>
  <!-- O with horned creature inside -->
  <g transform="translate(68, 5)">
    <!-- O circle -->
    <circle cx="22" cy="27" r="22" fill="none" stroke="#1a1a1a" stroke-width="6"/>
    <!-- Horned creature face -->
    <path d="M12 20 L8 8 M32 20 L36 8" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="15" cy="24" r="3" fill="#1a1a1a"/>
    <circle cx="29" cy="24" r="3" fill="#1a1a1a"/>
    <path d="M18 35 Q22 40 26 35" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  </g>
  <!-- S A -->
  <text x="115" y="45" class="logo-text">SA</text>
</svg>
